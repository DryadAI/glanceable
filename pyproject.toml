[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glanceable"
version = "0.1.0"
description = "Layout and typography engine for round, glanceable near-eye displays"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["smart-glasses", "hud", "typography", "circular-display", "wearable"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/DryadAI/glanceable"
Issues = "https://github.com/DryadAI/glanceable/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/glanceable"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
