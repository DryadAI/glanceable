[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glanceable"
version = "0.2.0"
description = "Layout and typography engine for round, glanceable near-eye displays"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["smart-glasses", "hud", "typography", "circular-display", "wearable"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
# glanceable.markdown only. Core stays Pillow-only, so callers who never render
# markdown do not pay for a parser. markdown-it-py is pure Python (~240KB) with
# one small dependency (mdurl) and the same >=3.10 floor as this package.
markdown = ["markdown-it-py>=3.0"]
dev = ["pytest>=7.0", "markdown-it-py>=3.0"]

[project.urls]
Homepage = "https://github.com/DryadAI/glanceable"
Issues = "https://github.com/DryadAI/glanceable/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/glanceable"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
